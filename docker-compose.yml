version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: itpm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-it_project_management}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itpm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-it_project_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Django REST API (Gunicorn) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itpm_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-secret-key-change-in-production}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,backend}
      DB_NAME: ${DB_NAME:-it_project_management}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-noreply@example.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    volumes:
      - media_data:/app/media
    networks:
      - itpm_network
    ports:
      - "8000:8000"

  # ─── React SPA (servi par Nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itpm_frontend
    restart: unless-stopped
    networks:
      - itpm_network
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  itpm_network:
    driver: bridge

volumes:
  postgres_data:
  media_data:
